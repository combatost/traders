<app-loader *ngIf="authService.loading$ | async"></app-loader>
<app-navigation *ngIf="authService.isLoggedIn$ | async"></app-navigation>
<!-- Locked User Card -->
<app-blocked-user-card *ngIf="isLocked"></app-blocked-user-card>

<!-- Main app content only if NOT locked and not loading -->
<router-outlet
  *ngIf="!(authService.loading$ | async) && !isLocked"
></router-outlet>
