<header class="navbar" [class.hidden]="isNavbarHidden" role="banner">
  <div
    class="navbar__brand"
    role="button"
    tabindex="0"
    (click)="navigateToHome()"
    (keydown.enter)="navigateToHome()"
  >
    {{ loginModeTitle }}
  </div>

  <button
    class="navbar__toggle"
    (click)="toggleMenu()"
    aria-label="Toggle menu"
    [attr.aria-expanded]="isNavbarOpen"
    aria-controls="main-navigation"
  >
    <svg
      *ngIf="!isNavbarOpen"
      class="icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="M3 6h18M3 12h18M3 18h18"
        stroke="currentColor"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"
      />
    </svg>
    <svg
      *ngIf="isNavbarOpen"
      class="icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="M6 18L18 6M6 6l12 12"
        stroke="currentColor"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"
      />
    </svg>
  </button>

  <nav
    id="main-navigation"
    class="navbar__menu"
    [class.open]="isNavbarOpen"
    role="navigation"
    aria-label="Primary Navigation"
  >
    <a
      role="link"
      tabindex="0"
      (click)="navigateToHome()"
      [class.active]="currentSection === 'home'"
      [attr.aria-current]="currentSection === 'home' ? 'page' : null"
    >
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
        />
      </svg>
      {{ "NAV.HOME" | translate }}
    </a>

    <!-- Clients Dropdown -->
    <div class="dropdown-container">
      <button
        class="dropdown-btn"
        [class.active]="['client', 'clientsList'].includes(currentSection)"
        (click)="toggleClientsDropdown()"
        aria-haspopup="true"
        [attr.aria-expanded]="isClientsDropdownOpen"
        aria-controls="clients-dropdown-menu"
      >
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
        </svg>
        {{ selectedClientLabel | translate }}
        <svg
          class="icon dropdown-icon"
          [class.rotated]="isClientsDropdownOpen"
          viewBox="0 0 24 24"
        >
          <path
            d="M6 9l6 6 6-6"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
          />
        </svg>
      </button>
      <div
        id="clients-dropdown-menu"
        class="dropdown-menu"
        [class.open]="isClientsDropdownOpen"
        role="menu"
        aria-label="Clients submenu"
      >
        <a
          role="menuitem"
          (click)="navigateToClient()"
          [class.active]="currentSection === 'client'"
        >
          {{ "NAV.CLIENTS" | translate }}
        </a>
        <a
          role="menuitem"
          (click)="navigateToList()"
          [class.active]="currentSection === 'clientsList'"
        >
          {{ "clientsList" | translate }}
        </a>
      </div>
    </div>

    <!-- Analytics -->
    <a
      role="link"
      (click)="navigateToAnalytics()"
      [class.active]="currentSection === 'analytics'"
      [attr.aria-current]="currentSection === 'analytics' ? 'page' : null"
    >
      <svg class="icon" viewBox="0 0 24 24">
        <path
          d="M3 3v18h18"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
        />
        <path
          d="M18 9l-4 4-5-5-4 4"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
        />
      </svg>
      {{ "NAV.ANALYTICS" | translate }}
    </a>

    <!-- About -->
    <a
      role="link"
      (click)="navigateToAbout()"
      [class.active]="currentSection === 'about'"
      [attr.aria-current]="currentSection === 'about' ? 'page' : null"
    >
      <svg
        class="icon"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
        fill="none"
      >
        <rect x="3" y="3" width="18" height="18" rx="4" />
        <line x1="12" y1="8" x2="12" y2="8" />
        <line x1="12" y1="12" x2="12" y2="16" />
      </svg>
      {{ "NAV.ABOUT" | translate }}
    </a>

    <!-- Settings Dropdown -->
    <div class="dropdown-container">
      <button
        class="dropdown-btn"
        [class.active]="['settings', 'history'].includes(currentSection)"
        (click)="toggleDropdown()"
        aria-haspopup="true"
        [attr.aria-expanded]="isDropdownOpen"
        aria-controls="settings-dropdown-menu"
      >
        <svg class="icon" viewBox="0 0 24 24">
          <circle
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
          />
          <path
            d="M12 8v4l3 3"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
          />
        </svg>
        {{ selectedSettingsLabel | translate }}
        <svg
          class="icon dropdown-icon"
          [class.rotated]="isDropdownOpen"
          viewBox="0 0 24 24"
        >
          <path
            d="M6 9l6 6 6-6"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
          />
        </svg>
      </button>
      <div
        id="settings-dropdown-menu"
        class="dropdown-menu"
        [class.open]="isDropdownOpen"
        role="menu"
        aria-label="Settings submenu"
      >
        <a
          role="menuitem"
          (click)="navigateToSettings()"
          [class.active]="currentSection === 'settings'"
        >
          {{ "NAV.SETTINGS" | translate }}
        </a>
        <a
          role="menuitem"
          (click)="navigateToHistory()"
          [class.active]="currentSection === 'history'"
        >
          {{ "NAV.HISTORY" | translate }}
        </a>
      </div>
    </div>

    <!-- Profile & Logout -->
    <div class="navbar__status-logout">
      <app-version-alert></app-version-alert>
      <div class="navbar__profile">
        <span class="profile-avatar">
          <svg
            width="30"
            height="30"
            viewBox="0 0 24 24"
            stroke="#6366f1"
            stroke-width="2"
            fill="none"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 19c0-3.3 3.6-6 8-6s8 2.7 8 6" />
            <circle cx="12" cy="12" r="11" stroke="#e5e7eb" stroke-width="1" />
          </svg>
        </span>
        <span class="profile-username">{{ userName }}</span>
      </div>
      <button
        class="navbar__logout"
        (click)="logout()"
        aria-label="Log out"
        type="button"
      >
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
          <polyline points="10 17 15 12 10 7" />
          <line x1="15" y1="12" x2="3" y2="12" />
        </svg>
      </button>
    </div>
  </nav>
</header>

<app-loader *ngIf="isLoading" [message]="'Logging out...'"></app-loader>
