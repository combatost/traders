<div *ngIf="vm$ | async as vm">
  <header class="admin-toolbar">
    <div class="toolbar-left">
      <ng-content></ng-content>
    </div>

    <button
      class="btn-icon logout-btn"
      (click)="logout()"
      aria-label="Logout"
      title="Logout"
    >
      <svg class="icon icon-logout" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M16 17l5-5-5-5M21 12H9M13 19v2H5V3h8v2" />
      </svg>
    </button>
  </header>

  <div *ngIf="vm.loading" class="progress-bar"></div>

  <main class="admin-content" *ngIf="!vm.loading && !vm.error">
    <section class="summary-bar">
      <article class="summary-item">
        <svg class="icon icon-total-users" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="7" r="4" />
          <path d="M4 21c0-3 16-3 16 0" />
        </svg>
        <div>
          <div class="count">{{ vm.users.length }}</div>
          <div class="label">Total Users</div>
        </div>
      </article>

      <article class="summary-item">
        <svg class="icon icon-online" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8" />
          <circle class="pulse" cx="12" cy="12" r="4" />
        </svg>
        <div>
          <div class="count">{{ vm.onlineCount }}</div>
          <div class="label">Online Now</div>
        </div>
      </article>
    </section>

    <section class="user-table-container">
      <table class="user-table" aria-label="User Table">
        <thead>
          <tr>
            <th>User</th>
            <th>Locked</th>
            <th>Unlock Since</th>
            <th>Online</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of vm.users" [class.locked]="user.isLocked">
            <td class="user-cell">
              <svg class="icon icon-person" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="7" r="5" />
                <path d="M5 21v-2a7 7 0 0114 0v2" />
              </svg>
              <div class="user-info">
                <div class="user-name">{{ user.fullName }}</div>
                <div class="user-email">{{ user.email }}</div>
              </div>
            </td>

            <td>
              <span class="chip" [class.locked]="user.isLocked" [class.unlocked]="!user.isLocked">
                {{ user.isLocked ? "Locked" : "Unlocked" }}
              </span>
            </td>

            <td>
              <span *ngIf="user.unlockSince; else noDate">
                {{ user.unlockSince?.toDate() | date : 'short' }}
              </span>
              <ng-template #noDate>-</ng-template>
            </td>

            <td>
              <svg
                class="icon icon-status"
                [class.online]="user.online"
                [class.offline]="!user.online"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="8" />
                <circle *ngIf="user.online" class="pulse" cx="12" cy="12" r="4" />
              </svg>
            </td>

            <td>
              <span class="chip" [class.admin]="user.isAdmin" [class.user]="!user.isAdmin">
                {{ user.isAdmin ? "Admin" : "User" }}
              </span>
            </td>

            <td class="actions-cell">
              <button
                class="btn-icon lock-toggle"
                (click)="toggleLock(user)"
                [attr.title]="user.isLocked ? 'Unlock User' : 'Lock User'"
                aria-label="Toggle Lock"
              >
                <svg
                  *ngIf="user.isLocked"
                  class="icon icon-lock"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <rect x="6" y="11" width="12" height="9" rx="2" ry="2" />
                  <path d="M9 11V7a3 3 0 016 0v4" />
                </svg>
                <svg
                  *ngIf="!user.isLocked"
                  class="icon icon-unlock"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <rect x="6" y="11" width="12" height="9" rx="2" ry="2" />
                  <path d="M9 11V7a3 3 0 016 0v1" />
                </svg>
              </button>

              <button
                class="btn-icon delete-btn"
                (click)="deleteUser(user)"
                title="Delete User"
                aria-label="Delete User"
              >
                <svg class="icon icon-delete" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M3 6h18M9 6v12M15 6v12M5 6l1 12a2 2 0 002 2h8a2 2 0 002-2l1-12"
                  />
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <section *ngIf="vm.error" class="error-card" role="alert">
    <svg class="icon icon-error" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="8" x2="12" y2="13" />
      <circle cx="12" cy="17" r="1" />
    </svg>
    {{ vm.error }}
  </section>
</div>
